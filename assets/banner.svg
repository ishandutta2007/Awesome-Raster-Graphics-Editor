<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-wave {
        animation: floatWave 8s ease-in-out infinite alternate;
      }
      .bg-particle-1 {
        animation: floatParticle 6s ease-in-out infinite alternate;
      }
      .bg-particle-2 {
        animation: floatParticle 9s ease-in-out infinite alternate-reverse;
      }
      .bg-particle-3 {
        animation: floatParticle 7s ease-in-out infinite alternate;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      @keyframes floatWave {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-15px) scale(1.02); }
      }
      @keyframes floatParticle {
        0% { transform: translate(0, 0); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translate(20px, -25px); opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Background Elements (Strictly Behind Foreground Text) -->
  <g class="bg-wave" opacity="0.35">
    <circle cx="1050" cy="80" r="180" fill="#7c3aed" filter="url(#glow)" />
    <circle cx="150" cy="300" r="140" fill="#db2777" filter="url(#glow)" />
    <circle cx="900" cy="280" r="120" fill="#2563eb" filter="url(#glow)" />
  </g>

  <!-- Dynamic Geometric Graphics Pixel Grid Particles -->
  <g opacity="0.4">
    <rect class="bg-particle-1" x="100" y="60" width="16" height="16" rx="3" fill="#38bdf8" />
    <rect class="bg-particle-2" x="220" y="120" width="24" height="24" rx="4" fill="#a78bfa" />
    <rect class="bg-particle-3" x="980" y="140" width="20" height="20" rx="4" fill="#f472b6" />
    <rect class="bg-particle-1" x="1060" y="220" width="14" height="14" rx="2" fill="#34d399" />
    <rect class="bg-particle-2" x="80" y="240" width="18" height="18" rx="3" fill="#fbbf24" />
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="240" height="32" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" class="badge-text">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text">Awesome Raster Graphics Editors 🎨</text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="190" width="500" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">The Ultimate Guide to Photo Editing, Digital Painting &amp; Open-Source Image Software</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="70" y="22" text-anchor="middle" class="badge-text">📸 Photo Editing</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="70" y="22" text-anchor="middle" class="badge-text">🖌️ Digital Painting</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="150" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="75" y="22" text-anchor="middle" class="badge-text">⚡ RAW Processing</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(475, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="70" y="22" text-anchor="middle" class="badge-text">🤖 AI Upscaling</text>
      </g>
    </g>
  </g>
</svg>
